spring:
  application:
    name: dnf-insight

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:password123@localhost:27017/dnf_insight?authSource=admin}
      database: ${SPRING_DATA_MONGODB_DATABASE:dnf_insight}

    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    user:
      name: admin
      password: admin123

server:
  port: ${SERVER_PORT:8080}

# DnF API 설정
dnf:
  api:
    key: ${DNF_API_KEY:your-api-key-here}
    base-url: ${DNF_API_BASE_URL:https://api.neople.co.kr}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dnf.insight: DEBUG
    org.springframework.data.mongodb: DEBUG
  file:
    name: logs/dnf-insight.log
