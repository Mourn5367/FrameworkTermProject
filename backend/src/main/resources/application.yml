spring:
  application:
    name: dnf-insight

  main:
    allow-bean-definition-overriding: true

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://admin:password123@localhost:27017/dnf_insight?authSource=admin}
      database: ${SPRING_DATA_MONGODB_DATABASE:dnf_insight}

    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  security:
    user:
      name: admin
      password: admin123

server:
  port: ${SERVER_PORT:8080}

# DnF API 설정
dnf:
  api:
    keys: ${DNF_API_KEYS:PSmv35du3EfiXNEtzf2Gdy4P9yba2tSJ,3v70cQoFmRHByQ57lUlrvOleakSoVhqg,9QLL8xNgcmwcVBnKlVPFmzRa9uN2MFTU}
    base-url: ${DNF_API_BASE_URL:https://api.neople.co.kr}
    image-base-url: ${DNF_IMAGE_BASE_URL:https://img-api.neople.co.kr}
    rate-limit:
      per-second: ${DNF_API_RATE_LIMIT_PER_SECOND:1000}
      per-minute: ${DNF_API_RATE_LIMIT_PER_MINUTE:60000}
      per-hour: ${DNF_API_RATE_LIMIT_PER_HOUR:3600000}
    cache:
      timeline-ttl: ${DNF_API_CACHE_TIMELINE_TTL:300}
      character-ttl: ${DNF_API_CACHE_CHARACTER_TTL:300}

# JWT 설정
jwt:
  secret: ${JWT_SECRET:your-jwt-secret-key-change-in-production-minimum-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}

# CORS 설정
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.dnf.insight: DEBUG
    org.springframework.data.mongodb: DEBUG
  file:
    name: logs/dnf-insight.log
